<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141c" media="(prefers-color-scheme: dark)">
<title>Infrasys POS 跳轉測試</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --fg:#172033; --muted:#55627a; --line:#d9dfe8;
  --accent:#1264d5; --accent-fg:#ffffff; --code-bg:#f2f5f9; --ok:#1f7a4d; --warn:#9a5b00;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f141c; --surface:#171e29; --fg:#e6ebf2; --muted:#9aa7ba; --line:#2a3443;
  --accent:#4a8df0; --code-bg:#1e2734; --ok:#5cc08d; --warn:#e0a54a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif;
  line-height:1.65;padding:max(32px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
.panel{max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-size:24px;margin:4px 0 0;line-height:1.3}
p{margin:0;color:var(--muted);font-size:15px}
strong{color:var(--fg)}
ol{margin:0;padding-left:1.3em;color:var(--muted);font-size:15px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#launch{width:100%;padding:16px;border:0;border-radius:12px;background:var(--accent);
  color:var(--accent-fg);font-size:17px;font-weight:700}
#launch:active,.btn-secondary:active{opacity:.85}
.step{display:flex;flex-direction:column;gap:10px}
.btn-secondary{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;
  border:1.5px solid var(--accent);color:var(--accent);background:transparent;font-size:16px;font-weight:700}
#status{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--code-bg);color:var(--muted)}
#status.done{color:var(--ok)}
.url{display:flex;gap:8px}
.url code{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;
  background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
#copy{border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:8px;padding:0 14px;font-size:14px;white-space:nowrap}
.note{font-size:13px;border-top:1px solid var(--line);padding-top:16px;color:var(--warn)}
</style>
</head>
<body>
<main class="panel">
  <div>
    <p class="eyebrow">iOS Shortcuts · URL Scheme</p>
    <h1>Infrasys POS 跳轉測試</h1>
  </div>
  <section class="step">
    <p class="eyebrow">步驟 1 · 首次使用</p>
    <p>安裝捷徑後，在「捷徑」App 確認名稱為 <strong>OpenInfrasysPOS</strong>（大小寫需一致，不能是「OpenInfrasysPOS 1」）。</p>
    <a id="install" class="btn-secondary" href="https://www.icloud.com/shortcuts/61824c8cc5784006aabc087532650248">設定捷徑</a>
  </section>
  <section class="step">
    <p class="eyebrow">步驟 2 · 開啟 POS</p>
    <button id="launch" type="button">開啟 Infrasys POS</button>
  </section>
  <p id="status" role="status">等待操作</p>
  <div>
    <p class="eyebrow" style="margin-bottom:6px">跳轉網址</p>
    <div class="url">
      <code id="u">shortcuts://run-shortcut?name=OpenInfrasysPOS</code>
      <button id="copy" type="button">複製</button>
    </div>
  </div>
  <p class="note">請用 Safari 開啟。LINE、Facebook 等 App 內建瀏覽器可能會阻擋跳轉；iOS 會顯示「是否執行捷徑」的確認視窗，網頁無法略過。</p>
</main>
<script>
const URL_SCHEME = 'shortcuts://run-shortcut?name=OpenInfrasysPOS';
const status = document.getElementById('status');
document.getElementById('launch').addEventListener('click', () => {
  status.textContent = '已嘗試開啟捷徑；請觀察是否跳轉或顯示確認視窗。';
  status.classList.add('done');
  window.location.href = URL_SCHEME;
});
document.getElementById('copy').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  try {
    await navigator.clipboard.writeText(URL_SCHEME);
    btn.textContent = '已複製';
  } catch (err) {
    const r = document.createRange();
    r.selectNodeContents(document.getElementById('u'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = '已選取';
  }
  setTimeout(() => (btn.textContent = '複製'), 1800);
});
</script>
</body>
</html>
